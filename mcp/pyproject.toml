[project]
name = "andra-mcp"
version = "0.1.0"
description = "Andra desktop reverse-engineering MCP server and CLI"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.6.0",
]

[project.scripts]
andra-mcp = "andra.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["andra"]
